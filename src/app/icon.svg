<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
    <!-- Latar Belakang Dark Terminal tanpa outline -->
    <rect width="100" height="100" fill="#111111"/>
    
    <!-- Teks RYHN (Shadow Offset) -->
    <text x="52%" y="54%"
          font-family="'Courier New', Courier, monospace"
          font-size="42"
          font-weight="900"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="#FF0055">
        RYHN
    </text>
    
    <!-- Teks RYHN (Utama) -->
    <text x="50%" y="50%"
          font-family="'Courier New', Courier, monospace"
          font-size="42"
          font-weight="900"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="#00FF41">
        RYHN
    </text>
</svg>
