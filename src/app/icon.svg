svg_content = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <!-- Latar Belakang Dark Terminal -->
    <rect width="100%" height="100%" fill="#111111"/>
    
    <!-- Pola Grid (Estetika Terminal/Brutalism) -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Bayangan Solid Hard Offset (Khas Neobrutalism) -->
    <text x="51.5%" y="53%"
          font-family="'Courier New', Courier, monospace"
          font-size="220"
          font-weight="900"
          letter-spacing="20"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="#FF0055">
        RYHN
    </text>

    <!-- Teks Utama (Warna Hijau Fosfor khas Terminal) -->
    <text x="50%" y="50%"
          font-family="'Courier New', Courier, monospace"
          font-size="220"
          font-weight="900"
          letter-spacing="20"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="#00FF41">
        RYHN
    </text>
</svg>"""

file_path = "RYHN_dark_terminal.svg"
with open(file_path, "w", encoding="utf-8") as f:
    f.write(svg_content)

print(f"File created at {file_path}")